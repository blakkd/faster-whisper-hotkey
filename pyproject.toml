[build-system]
requires = ["setuptools >= 42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-whisper-hotkey"
version = "0.8.0"
description = "Push-to-talk transcription"
readme = "README.md"
authors = [{name = "blakkd"}]
license-files = ["LICENSE.txt"]
requires-python = "==3.11.14"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

keywords = [
    "keyboard", "recognition", "voice", "typing", "speech",
    "shortcut", "speech-to-text", "hotkey", "stt", "asr",
    "faster-whisper", "whisper", "parakeet", "canary", "voxtral",
    "cohere", "granite", "qwen3-asr",
]

# DEPENDENCIES
dependencies = [
    "sounddevice==0.5.5",
    "numpy==2.2.6",
    "faster-whisper==1.2.1",
    "pynput==1.8.2",
    "pulsectl==24.12.0",
    "torch==2.12.1",
    "torchaudio==2.11.0",
    "nemo-toolkit[asr]==3.0.0",
    "lightning==2.6.6",
    "requests==2.34.2",
    "importlib_resources==7.1.0",
    "mistral-common[audio]==1.11.7",
    "transformers==5.17.0",
    # Pinned: 0.50.x stores 4bit-linear biases as float32 (0.49.x: checkpoint
    # dtype). The first model param is then an f32 bias, so model.dtype flips
    # to f32 and model-internal input casts (e.g. granite_speech forward) feed
    # f32 into bf16 LayerNorms -> RuntimeError on cuda/int4.
    "bitsandbytes==0.49.2",
    "pyperclip==1.11.0",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "sentencepiece==0.2.2",
    "protobuf==5.29.6",
    "onnx==1.22.0",
    "accelerate==1.15.0",
    "silero-vad>=6.2.1",
    "moondream==2.5.0",
]

# DEV TOOLS (kept in the lock so `uv sync` doesn't prune them)
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "pyright==1.1.414",
]

# SCRIPTS
[project.scripts]
faster-whisper-hotkey = "faster_whisper_hotkey.__main__:main"

# SETUPTOOLS
[tool.setuptools]
packages = ["faster_whisper_hotkey"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
faster_whisper_hotkey = ["*.json"]

# RUFF
[tool.ruff]
line-length = 120

# PYRIGHT
[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

# UV
# Absolute cutoff so the lockfile stays valid despite the machine-global
# "exclude-newer = 7 days" setting (relative windows would exclude freshly
# published packages like moondream). Bump this date when adding a package
# published after it.
[tool.uv]
exclude-newer = "2026-09-25T00:00:00Z"
# nemo-toolkit[asr] declares lightning>2.2.1,<=2.4.0, but the `lightning`
# meta-package bundles the executed pytorch code under `lightning.pytorch`
# (which NeMo imports), and that bundled copy is only patched in >=2.6.6
# (CVE-2026-58659: RCE via checkpoint `_instantiator` in
# load_from_checkpoint; CVE-2026-31221: insecure checkpoint deserialization).
# `lightning` depends on the separate `pytorch-lightning` dist unpinned, and
# that dist carries the same CVEs at <=2.4.0, so both are pinned to the
# patched release.
override-dependencies = ["lightning==2.6.6", "pytorch-lightning==2.6.6"]
