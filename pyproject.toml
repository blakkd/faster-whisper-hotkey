[build-system]
requires = ["setuptools >= 42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-whisper-hotkey"
version = "0.7.1"
description = "Push-to-talk transcription"
readme = "README.md"
authors = [{name = "blakkd"}]
license-files = ["LICENSE.txt"]
requires-python = "==3.11.14"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

keywords = [
    "keyboard", "recognition", "voice", "typing", "speech",
    "shortcut", "speech-to-text", "hotkey", "stt", "asr",
    "faster-whisper", "whisper", "parakeet", "canary", "voxtral",
    "cohere", "granite", "qwen3-asr",
]

# DEPENDENCIES
dependencies = [
    "sounddevice==0.5.5",
    "numpy==2.2.6",
    "faster-whisper==1.2.1",
    "pynput==1.8.2",
    "pulsectl==24.12.0",
    "torch==2.12.1",
    "torchaudio==2.11.0",
    "nemo-toolkit[asr]==3.0.0",
    "requests==2.34.2",
    "importlib_resources==7.1.0",
    "mistral-common[audio]==1.11.7",
    "transformers==5.17.0",
    "bitsandbytes>=0.46.1",
    "pyperclip==1.11.0",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "sentencepiece==0.2.1",
    "protobuf==5.29.6",
    "onnx==1.22.0",
    "accelerate==1.14.0",
    "silero-vad>=6.2.1",
]

# DEV TOOLS (kept in the lock so `uv sync` doesn't prune them)
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "pyright==1.1.411",
]

# SCRIPTS
[project.scripts]
faster-whisper-hotkey = "faster_whisper_hotkey.__main__:main"

# SETUPTOOLS
[tool.setuptools]
packages = ["faster_whisper_hotkey"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
faster_whisper_hotkey = ["*.json"]

# RUFF
[tool.ruff]
line-length = 120

# PYRIGHT
[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
exclude = ["src/faster_whisper_hotkey/models.py"]
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
