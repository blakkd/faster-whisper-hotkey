[build-system]
requires = ["setuptools >= 42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-whisper-hotkey"
version = "0.9.0"
description = "Push-to-talk transcription"
readme = "README.md"
authors = [{name = "blakkd"}]
license-files = ["LICENSE.txt"]
requires-python = "==3.11.14"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

keywords = [
    "keyboard", "recognition", "voice", "typing", "speech",
    "shortcut", "speech-to-text", "hotkey", "stt", "asr",
    "faster-whisper", "whisper", "parakeet", "canary", "voxtral",
    "cohere", "granite", "qwen3-asr",
]

# DEPENDENCIES
# One inference engine: transcribe-cpp (pure-Python ctypes binding) plus its
# native ggml provider (CPU + Vulkan wheels on Linux; CUDA is built from
# source, see dev/onboarding.md). Everything that previously came with
# CTranslate2, NeMo, Photon, transformers and bitsandbytes is gone.
dependencies = [
    "sounddevice==0.5.5",
    "numpy==2.2.6",
    "pynput==1.8.2",
    "pulsectl==24.12.0",
    "requests==2.34.2",
    "pyperclip==1.11.0",
    "soundfile==0.14.0",
    "transcribe-cpp==0.4.2",
]

# DEV TOOLS (kept in the lock so `uv sync` doesn't prune them)
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "pyright==1.1.414",
]

# SCRIPTS
[project.scripts]
faster-whisper-hotkey = "faster_whisper_hotkey.__main__:main"

# SETUPTOOLS
[tool.setuptools]
packages = ["faster_whisper_hotkey"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
faster_whisper_hotkey = ["*.json", "assets/*.wav"]

# RUFF
[tool.ruff]
line-length = 120

# PYRIGHT
[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

# UV
[tool.uv]
# (no override-dependencies: the transcribe.cpp engine has no CVE workarounds
# to carry — the former lightning/hydra-core pins existed only for NeMo)
