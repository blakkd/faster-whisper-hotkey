[build-system]
requires = ["setuptools >= 42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-whisper-hotkey"
version = "0.10.0"
description = "Push-to-talk transcription"
readme = "README.md"
authors = [{name = "blakkd"}]
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
]

keywords = [
    "keyboard", "recognition", "voice", "typing", "speech",
    "shortcut", "speech-to-text", "hotkey", "stt", "asr",
    "faster-whisper", "whisper", "parakeet", "canary", "voxtral",
    "cohere", "granite", "qwen3-asr",
]

# DEPENDENCIES
# One inference engine: transcribe-cpp (pure-Python ctypes binding) plus its
# native ggml provider (CPU + Vulkan wheels on Linux; CUDA is the opt-in
# `cu12` extra served on a GitHub Pages index — see dev/onboarding.md).
# Everything that previously came with CTranslate2, NeMo, Photon, transformers
# and bitsandbytes is gone.
# Floors, not pins: exact versions live in uv.lock for the dev environment, so
# installs on any supported Python (3.10-3.15) can resolve wheels built for it
# (e.g. numpy has no cp314/cp315 wheels at 2.2.x).
dependencies = [
    "sounddevice>=0.5.5",
    "numpy>=2.2.6",
    "pynput>=1.8.2",
    "pulsectl>=24.12.0",
    "requests>=2.34.2",
    "pyperclip>=1.11.0",
    "soundfile>=0.14.0",
    "transcribe-cpp>=0.4.2",
]

# DEV TOOLS (kept in the lock so `uv sync` doesn't prune them)
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "pyright>=1.1.414",
]

# SCRIPTS
[project.scripts]
faster-whisper-hotkey = "faster_whisper_hotkey.__main__:main"

# SETUPTOOLS
[tool.setuptools]
packages = ["faster_whisper_hotkey"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
faster_whisper_hotkey = ["*.json", "assets/*.json", "assets/*.wav"]

# RUFF
[tool.ruff]
line-length = 120

# PYRIGHT
[tool.pyright]
pythonVersion = "3.10"
include = ["src"]
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

# UV
[tool.uv]
# (no override-dependencies: the transcribe.cpp engine has no CVE workarounds
# to carry — the former lightning/hydra-core pins existed only for NeMo)
