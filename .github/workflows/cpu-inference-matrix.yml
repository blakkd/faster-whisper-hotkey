name: CPU inference matrix

on:
  workflow_dispatch: {}

jobs:
  cpu-matrix:
    runs-on: ubuntu-latest
    environment: actions
    timeout-minutes: 30
    # One job per model. Each job runs on its own runner, so if GitHub tears a
    # runner down mid-download (hosted runners get recycled) it only loses that
    # model's ~5 minutes; the other jobs keep going and still publish results
    # (fail-fast: false).
    strategy:
      fail-fast: false
      matrix:
        # voxtral is CUDA-only, so it is exercised by the local GPU run, not here.
        include:
          - model: whisper
            test_class: TestTranscribeWhisper
          - model: parakeet-ultra
            test_class: TestTranscribeParakeetUltra
          - model: canary
            test_class: TestTranscribeCanary
          - model: cohere
            test_class: TestTranscribeCohere
          - model: granite-nar
            test_class: TestTranscribeGraniteNAR
          - model: granite
            test_class: TestTranscribeGranite
          - model: granite-turboctc
            test_class: TestTranscribeGraniteTurboCTC
          - model: qwen3-asr
            test_class: TestTranscribeQwen3ASR
    steps:
      # No third-party actions: the repo policy only allows actions owned
      # by blakkd, so every step is plain shell.

      - name: Checkout
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      # Fail fast (seconds) if the token is missing/invalid instead of
      # minutes of model downloads. Never prints the token value.
      - name: Verify HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty - check the 'actions' environment secret"
            exit 1
          fi
          uv run python - <<'PY'
          import os
          from huggingface_hub import model_info, whoami

          who = whoami()
          print(f"HF auth OK: user={who.get('name')} token_len={len(os.environ['HF_TOKEN'])}")
          info = model_info("CohereLabs/cohere-transcribe-03-2026")
          print(f"gated model accessible: {info.modelId} gated={info.gated}")
          PY

      # Run the single model this job is responsible for. -s streams progress
      # and the [disk] line into the live log so a torn-down runner still shows
      # how far it got.
      - name: Run ${{ matrix.model }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          df -h /
          uv run pytest "tests/test_model_all_configs.py::${{ matrix.test_class }}" -v --tb=short -s

      # Surface this model's transcription on the run page. (For a job that is
      # hard-killed the runner is gone, so the streamed job log is the record.)
      - name: Publish results
        if: always()
        run: |
          {
            echo "### ${{ matrix.model }} — transcription"
            echo ""
            echo '```'
            cat test_audio_data/transcription_results.txt 2>/dev/null || echo "no results file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
