name: CPU inference matrix

on:
  workflow_dispatch: {}

jobs:
  cpu-matrix:
    runs-on: ubuntu-latest
    environment: actions
    timeout-minutes: 300
    steps:
      # No third-party actions: the repo policy only allows actions owned
      # by blakkd, so every step is plain shell.

      - name: Checkout
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      # Fail fast (seconds) if the token is missing/invalid instead of
      # ~10 minutes of model downloads. Never prints the token value.
      - name: Verify HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty - check the 'actions' environment secret"
            exit 1
          fi
          uv run python - <<'PY'
          import os
          from huggingface_hub import model_info, whoami

          who = whoami()
          print(f"HF auth OK: user={who.get('name')} token_len={len(os.environ['HF_TOKEN'])}")
          info = model_info("CohereLabs/cohere-transcribe-03-2026")
          print(f"gated model accessible: {info.modelId} gated={info.gated}")
          PY

      # CUDA configs auto-skip on a GPU-less runner (14 CPU configs run).
      # ~30 GB of models are re-downloaded on each run (no cache action allowed).
      - name: Run CPU inference matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest tests/test_model_all_configs.py -v --tb=short

      - name: Publish results
        if: always()
        run: cat test_audio_data/transcription_results.txt >> "$GITHUB_STEP_SUMMARY" || echo "no results file"
